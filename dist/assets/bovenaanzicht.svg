<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Indicatief bovenaanzicht van St Bartholomew the Less</title>
  <desc id="desc">Niet-maatvaste reconstructie met een achthoekig schip binnen een vrijwel vierkante oudere omtrek, vijfzijdig koor, westgalerij, zuidwesttoren en noordwestelijke sacristie.</desc>
  <defs>
    <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#d9e9f0" stroke-width="1"/>
    </pattern>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#smallGrid)"/>
      <path d="M100 0H0V100" fill="none" stroke="#bdd5e1" stroke-width="1.4"/>
    </pattern>
    <pattern id="tiles" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#dcecf3"/>
      <rect x="9" y="9" width="9" height="9" fill="#dcecf3"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#154273"/>
    </marker>
    <style>
      .wall{fill:none;stroke:#154273;stroke-width:16;stroke-linejoin:miter}
      .inner{fill:none;stroke:#01689b;stroke-width:4;stroke-linejoin:round}
      .thin{fill:none;stroke:#154273;stroke-width:2}
      .dash{fill:none;stroke:#01689b;stroke-width:2;stroke-dasharray:8 7}
      .label{font:700 18px Verdana,sans-serif;fill:#154273;letter-spacing:.03em}
      .small{font:14px Verdana,sans-serif;fill:#39586d}
      .micro{font:11px Verdana,sans-serif;fill:#39586d;letter-spacing:.08em}
      .call{fill:#154273;stroke:#fff;stroke-width:3}
      .num{font:700 15px Verdana,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>

  <rect width="1200" height="800" fill="#f8fcfd"/>
  <rect x="30" y="30" width="1140" height="740" fill="url(#grid)" stroke="#154273" stroke-width="2"/>
  <text x="62" y="72" class="micro">ST BARTHOLOMEW THE LESS · LONDON</text>
  <text x="62" y="104" class="label">BOVENAANZICHT · INDICATIEVE RECONSTRUCTIE</text>

  <!-- Main medieval envelope and octagonal nave -->
  <rect x="242" y="174" width="574" height="452" fill="#fff" stroke="#154273" stroke-width="14"/>
  <polygon points="330,194 710,194 796,280 796,520 710,606 330,606 262,520 262,280" fill="url(#tiles)" stroke="#01689b" stroke-width="6"/>

  <!-- Triangular corner spaces -->
  <path d="M262 280 242 174 330 194M710 194 816 174 796 280M796 520 816 626 710 606M330 606 242 626 262 520" class="dash"/>

  <!-- Chancel and five-sided apse: five exterior sides, open at nave -->
  <path d="M796 302 900 254 1015 320 1044 400 1015 480 900 546 796 498" fill="#eef6f9" stroke="#154273" stroke-width="14" stroke-linejoin="miter"/>
  <path d="M796 302V350M796 450V498" class="wall"/>
  <path d="M805 350Q845 400 805 450" class="inner"/>
  <line x1="918" y1="287" x2="918" y2="513" class="dash"/>
  <rect x="935" y="365" width="58" height="70" fill="#fff" stroke="#154273" stroke-width="3"/>
  <text x="964" y="404" class="micro" text-anchor="middle">ALTAAR</text>

  <!-- West narthex / entrance -->
  <path d="M242 333H166V467H242" fill="#eef6f9" stroke="#154273" stroke-width="14"/>
  <path d="M166 376h-24m24 48h-24" class="thin"/>
  <path d="M142 376q24 0 24 24M142 424q24 0 24-24" class="thin"/>
  <text x="193" y="403" class="micro" text-anchor="middle" transform="rotate(-90 193 403)">NARTHEX</text>

  <!-- NW vestry -->
  <rect x="100" y="172" width="142" height="128" fill="#f1eadf" stroke="#154273" stroke-width="14"/>
  <path d="M242 222h-28m28 44h-28" class="thin"/>
  <text x="171" y="231" class="small" text-anchor="middle">SACRISTIE</text>
  <text x="171" y="253" class="micro" text-anchor="middle">LAATMIDDELEEUWS</text>

  <!-- SW tower -->
  <rect x="100" y="500" width="142" height="158" fill="#e3edf2" stroke="#154273" stroke-width="14"/>
  <path d="M119 519h104v120H119zM119 519l104 120M223 519 119 639" class="thin"/>
  <text x="171" y="575" class="small" text-anchor="middle">TOREN</text>
  <text x="171" y="598" class="micro" text-anchor="middle">15E EEUW</text>

  <!-- Organ gallery and seating -->
  <rect x="277" y="321" width="74" height="158" fill="#e5f1f7" stroke="#01689b" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="314" y="402" class="micro" text-anchor="middle" transform="rotate(-90 314 402)">ORGELGALERIJ BOVEN</text>
  <g stroke="#6f8796" stroke-width="4">
    <path d="M385 270h112M385 296h112M385 322h112M385 348h112M385 452h112M385 478h112M385 504h112M385 530h112"/>
    <path d="M545 270h112M545 296h112M545 322h112M545 348h112M545 452h112M545 478h112M545 504h112M545 530h112"/>
  </g>
  <rect x="505" y="244" width="32" height="312" fill="#fff" stroke="#bdd5e1" stroke-width="2"/>
  <text x="521" y="407" class="micro" text-anchor="middle" transform="rotate(-90 521 407)">MIDDENPAD</text>
  <circle cx="756" cy="472" r="18" fill="#fff" stroke="#154273" stroke-width="3"/>
  <text x="756" y="477" class="micro" text-anchor="middle">P</text>

  <!-- Callouts -->
  <g>
    <path d="M520 206V138H470" class="thin"/>
    <circle cx="450" cy="138" r="17" class="call"/><text x="450" y="139" class="num">1</text>
    <path d="M962 292V190h70" class="thin"/>
    <circle cx="1052" cy="190" r="17" class="call"/><text x="1052" y="191" class="num">2</text>
    <path d="M759 225 848 130h38" class="thin"/>
    <circle cx="906" cy="130" r="17" class="call"/><text x="906" y="131" class="num">3</text>
    <path d="M314 394 210 390" class="thin"/>
    <circle cx="190" cy="390" r="17" class="call"/><text x="190" y="391" class="num">4</text>
    <path d="M118 620 68 690" class="thin"/>
    <circle cx="58" cy="710" r="17" class="call"/><text x="58" y="711" class="num">5</text>
    <path d="M120 194 74 130" class="thin"/>
    <circle cx="62" cy="112" r="17" class="call"/><text x="62" y="113" class="num">6</text>
  </g>

  <!-- Orientation -->
  <g transform="translate(1100 105)">
    <text x="0" y="-18" class="label" text-anchor="middle">N</text>
    <path d="M0 42V0" stroke="#154273" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="0" cy="42" r="4" fill="#154273"/>
  </g>

  <!-- Title block -->
  <rect x="650" y="674" width="490" height="76" fill="#fff" stroke="#154273" stroke-width="2"/>
  <line x1="930" y1="674" x2="930" y2="750" stroke="#154273" stroke-width="1"/>
  <text x="670" y="699" class="micro">TYPE</text>
  <text x="670" y="724" class="label">MODELAFGELEID · NIET MAATVAST</text>
  <text x="950" y="699" class="micro">BRONNEN</text>
  <text x="950" y="721" class="small">3D-model + lijstbeschrijving</text>
  <text x="950" y="741" class="micro">VERSIE 28-10-2026</text>
</svg>
